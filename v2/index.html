<meta charset="utf-8">
<meta name="theme-color" content="#F1F2F4">
<title>Мобильный Lab4 Insight v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<style>
  /* ===== Токены дизайн-системы Lab4U, имена из ДИЗАЙН_СИСТЕМА_Lab4U.md (основной файл ⚙️ Design System) ===== */
  :root {
    --brand-base: #00AACC;            /* Brand/Base */
    --brand-bg: #00AACC1F;            /* Brand/BG */
    --text-a100: #030204;             /* Text & Icon/Black Inverse/A100 */
    --text-a56: #0302048F;            /* Text & Icon/Black Inverse/A56 */
    --text-a32: #03020452;            /* Text & Icon/Black Inverse/A32 */
    --text-white: #FFFFFF;            /* Text & Icon/Fixed/White/A100 */
    --stroke-a12: #0302041F;          /* Stroke/Black Inverse/A12 */
    --stroke-a4: #0302040A;           /* Stroke/Black Inverse/A4 */
    --wrapper-a4: #0302040A;          /* Wrapper/Black Inverse/A4 */
    --wrapper-a6: #0302040F;          /* Wrapper/Black Inverse/A6 */
    --wrapper-a12: #0302041F;         /* Wrapper/Black Inverse/A12 */
    --bg-base: #F1F2F4;               /* Background/BG/Base */
    --surface-base: #FFFFFF;          /* Background/Surface/Base */
    --modals-base: #FFFFFF;           /* Background/Modals/Base */
    --overlay: #03020452;             /* Overlay/Base */
    --success: #00CC84;               /* RGB/Status/Success/Base */
    --success-bg: #00CC841F;          /* RGB/Status/Success/BG */
    --warning: #FFA500;               /* RGB/Status/Warning/Base */
    --negative: #EF5350;              /* RGB/Status/Negative/Base: «ниже» и «выше» референса */
    --negative-bg: #EF53501F;         /* RGB/Status/Negative/BG */
    --mono-700: #778197;              /* MONO/700: «у границы», решение прототипа */
    --mono-100: #EBECF0;              /* MONO/100 */
    --mono-150: #E2E4E9;              /* MONO/150, Stroke/Base */
    --seg-ok: #77DD77; --seg-off: #F07A73; --seg-edge: #B1B7C3;      /* заливки карточек показателей, решение 10.09 */
    --seg-ok-line: #3D9440; --seg-off-line: #B84A42; --seg-edge-line: #6C7484;
    --r-4: 4px; --r-8: 8px; --r-12: 12px; --r-20: 20px; --r-24: 24px;   /* Radius/radius-* */
    --s-4: 4px; --s-6: 6px; --s-8: 8px; --s-10: 10px; --s-12: 12px; --s-16: 16px; --s-20: 20px; --s-24: 24px; --s-32: 32px; --s-40: 40px;
    --shadow-600: 0 16px 32px #0302041F, 0 4px 12px -4px #0302041F;   /* shadow/600 */
    --effects-menu: 0 8px 30px #30393A1A;                               /* effects/Menu */
    --font: "Roboto", -apple-system, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg-base); color: var(--text-a100); font: 16px/24px var(--font); }
  body.noscroll { overflow: hidden; }
  p, h1, h2, h3, h4, ul, ol { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  input { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* типографика, роли набора NEW */
  .t-6xl { font-size: 32px; line-height: 40px; font-weight: 700; text-wrap: balance; }
  .t-4xl { font-size: 24px; line-height: 32px; font-weight: 700; text-wrap: balance; }
  .t-3xl { font-size: 20px; line-height: 24px; font-weight: 700; text-wrap: balance; }
  .t-2xl { font-size: 18px; line-height: 24px; font-weight: 700; }
  .t-xl  { font-size: 16px; line-height: 24px; font-weight: 600; }
  .t-l   { font-size: 14px; line-height: 20px; font-weight: 600; }
  .b-xl  { font-size: 16px; line-height: 24px; font-weight: 400; }
  .b-l   { font-size: 14px; line-height: 20px; font-weight: 400; }
  .b-m   { font-size: 12px; line-height: 16px; font-weight: 400; }
  .caps  { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
  .muted { color: var(--text-a56); }

  /* раскладка: mobile first, на широком экране колонка до 640 */
  .app { max-width: 640px; margin: 0 auto; padding: 0 var(--s-16) 160px; }
  .stack { display: flex; flex-direction: column; gap: var(--s-8); }
  .sec { margin: var(--s-32) var(--s-4) var(--s-12); }
  .meta { margin: var(--s-8) var(--s-4) 0; }
  .big { margin: var(--s-4) var(--s-4) 0; }
  .sub-head { margin: var(--s-8) var(--s-4) 0; }
  /* шапка экрана как в «Здоровье»: круглая иконка, крупный заголовок и текст по центру */
  .head { display: flex; flex-direction: column; align-items: center; gap: var(--s-8); text-align: center; padding: var(--s-16) var(--s-8) var(--s-8); }
  .head-ic { width: 80px; height: 80px; border-radius: 50%; background: var(--surface-base); display: grid; place-items: center; color: var(--brand-base); margin-bottom: var(--s-12); }
  .head-ic .lt { opacity: .45; }
  .head .b-xl { max-width: 36ch; }

  /* шапка: круглые кнопки, как в «Здоровье» */
  .appbar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: var(--s-8) 0; margin: 0 calc(-1 * var(--s-16)); padding-left: var(--s-16); padding-right: var(--s-16); background: #F1F2F4E6; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .appbar .title { text-align: center; font-size: 16px; line-height: 20px; font-weight: 600; }
  .rbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-base); box-shadow: 0 2px 8px #03020414; display: grid; place-items: center; color: var(--text-a100); }
  .rbtn:hover { opacity: .8; } .rbtn:active { opacity: .7; }
  .rbtn.ghost { visibility: hidden; }

  /* карточки */
  .card { background: var(--surface-base); border-radius: var(--r-20); padding: var(--s-16); }
  .card + .card, .card + .act, .act + .act, .act + .card, .qcard + .card, .qcard + .act { margin-top: var(--s-12); }
  .what > * + * { margin-top: var(--s-12); }
  .what > p.t-l { margin: var(--s-24) var(--s-4) var(--s-8); }
  .what > p.t-l + * { margin-top: 0; }
  .tap { display: block; width: 100%; text-align: left; cursor: pointer; }
  .tap:active { opacity: .85; }
  .cat { display: flex; align-items: center; gap: var(--s-8); margin-bottom: var(--s-6); }
  .cat .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; flex: none; }
  .cat .chev { margin-left: auto; color: var(--text-a32); display: grid; }
  .st-off { color: var(--negative); } .bg-off { background: var(--negative); }
  .st-edge { color: var(--mono-700); } .bg-edge { background: var(--mono-700); }
  .st-exp, .st-ok { color: var(--success); } .bg-exp, .bg-ok { background: var(--success); }
  .st-brand { color: var(--brand-base); } .bg-brand { background: var(--brand-base); }

  /* шкала референса: ниже нормы 0–25 %, норма 25–75 %, выше 75–100 % */
  .scale { position: relative; height: 8px; border-radius: 4px; background: var(--mono-100); margin: var(--s-16) 0 var(--s-6); }
  .scale .z { position: absolute; top: 0; bottom: 0; left: 25%; right: 25%; background: #00CC8447; border-radius: 4px; }
  .scale .m { position: absolute; top: -5px; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px #0302044D; transform: translateX(-50%); }
  .scale-l { position: relative; height: 16px; font-size: 12px; line-height: 16px; color: var(--text-a56); }
  .scale-l span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

  /* чипы превью содержимого */
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-6); margin-top: var(--s-12); }
  .chips .ch { font-size: 12px; line-height: 16px; padding: 4px 10px; border-radius: 999px; background: var(--wrapper-a6); }
  .chips .ch.hot { background: var(--brand-bg); color: var(--brand-base); font-weight: 600; }
  .chips .go { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--brand-bg); color: var(--brand-base); display: grid; place-items: center; }

  /* кнопки: buttonAccent LG, состояния прозрачностью 100/80/70/35 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-8); min-height: 48px; padding: 12px 16px; border-radius: var(--r-12); font-size: 16px; line-height: 24px; font-weight: 600; background: var(--brand-base); color: var(--text-white); width: 100%; text-align: center; }
  .btn:hover { opacity: .8; } .btn:active { opacity: .7; } .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.on { background: var(--brand-bg); color: var(--brand-base); box-shadow: inset 0 0 0 1.5px var(--brand-base); }
  .btn.on:hover { opacity: 1; }
  .btn-sec { background: var(--wrapper-a6); color: var(--text-a100); }
  .btn-sm { min-height: 40px; padding: 10px 16px; border-radius: var(--r-8); font-size: 14px; line-height: 20px; width: auto; }
  .link { color: var(--brand-base); font-weight: 500; }
  .link:hover { opacity: .8; }
  .opt { flex: 1; min-height: 48px; border-radius: var(--r-12); background: var(--wrapper-a6); font-weight: 600; font-size: 16px; }
  .opt:hover { opacity: .8; } .opt:active { opacity: .7; }
  .opt[aria-pressed="true"] { background: var(--brand-base); color: var(--text-white); }
  .opts { display: flex; gap: var(--s-8); margin-top: var(--s-12); }
  .opts.wrap { flex-wrap: wrap; } .opts.wrap .opt { flex: 1 1 auto; padding: 0 var(--s-16); min-height: 40px; border-radius: var(--r-8); font-size: 14px; }
  :focus-visible { outline: 2px solid var(--brand-base); outline-offset: 2px; }

  /* карточка действия: иконка, суть, содержание, кнопка */
  .act { background: var(--surface-base); border-radius: var(--r-20); padding: var(--s-16); display: grid; grid-template-columns: 40px 1fr; gap: var(--s-12); }
  .act .body { min-width: 0; display: flex; flex-direction: column; gap: var(--s-8); }
  .act .ttl { font-size: 18px; line-height: 24px; font-weight: 700; }
  .act .lead { font-size: 15px; line-height: 22px; }
  .act .cta { margin-top: var(--s-4); }
  .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--wrapper-a6); display: grid; place-items: center; color: var(--text-a100); flex: none; }
  .ic.brand { background: var(--brand-bg); color: var(--brand-base); }
  .list { padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--s-6); }
  .list li { list-style: none; display: grid; grid-template-columns: 14px 1fr; gap: var(--s-8); font-size: 15px; line-height: 22px; }
  .list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-base); margin: 8px 0 0 4px; }
  .stub { font-size: 12px; line-height: 16px; color: var(--text-a56); border-top: 1px dashed var(--stroke-a12); padding-top: var(--s-8); }
  .note { background: var(--brand-bg); border-radius: var(--r-12); padding: var(--s-8) var(--s-12); font-size: 14px; line-height: 20px; }

  /* кольцо покрытия */
  .ring { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .ring i { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-base); display: grid; place-items: center; font-style: normal; font-weight: 600; font-size: 11px; line-height: 12px; color: var(--text-a100); }
  .ring.sm { width: 32px; height: 32px; } .ring.sm i { width: 24px; height: 24px; font-size: 10px; }

  /* лента карточек показателей, перенесена из v3.5 */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 120px; gap: 6px; margin: var(--s-4) calc(-1 * var(--s-16)) 0 0; padding: 0 var(--s-16) 6px 0; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sg { position: relative; min-height: 120px; border-radius: var(--r-12); background: var(--surface-base); padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 15px; box-shadow: inset 0 0 0 1px var(--stroke-a12); }
  .sg b { font-weight: 600; }
  .sg .v { margin-top: auto; padding-top: 6px; font-size: 15px; line-height: 18px; font-weight: 700; display: flex; flex-direction: column; }
  .sg .v small { font-size: 11px; line-height: 14px; font-weight: 400; opacity: .75; }
  .sg.has { box-shadow: none; }
  .sg.has.s-ok { background: var(--seg-ok); --cb: var(--seg-ok-line); }
  .sg.has.s-low, .sg.has.s-high { background: var(--seg-off); --cb: var(--seg-off-line); }
  .sg.has.s-edge { background: var(--seg-edge); --cb: var(--seg-edge-line); }
  .sg .cb { width: 16px; height: 16px; border-radius: var(--r-4); border: 1px solid var(--stroke-a12); background: var(--surface-base); display: inline-grid; place-content: center; margin-bottom: 2px; flex: none; }
  .sg .cb.done { background: #fff; border: 1.5px solid var(--cb); }
  .sg .cb.done::after, .sg.on .cb::after { content: ""; width: 8px; height: 5px; border: 2px solid var(--cb, var(--brand-base)); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
  .sg.pick { cursor: pointer; } .sg.pick:hover { box-shadow: inset 0 0 0 1px var(--brand-base); }
  .sg.pick:focus-within { outline: 2px solid var(--brand-base); outline-offset: 2px; }
  .sg.on { background: var(--brand-base); color: var(--text-white); box-shadow: none; --cb: var(--brand-base); }
  .sg.on .cb { background: #fff; border-color: #fff; }
  .foot { display: grid; gap: var(--s-12); margin-top: var(--s-8); }

  /* строки списка: List/Cell */
  .cells { background: var(--surface-base); border-radius: var(--r-20); overflow: hidden; }
  .cell { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--s-12); min-height: 52px; padding: var(--s-8) var(--s-16); border-top: 1px solid var(--stroke-a4); }
  .cell:first-child { border-top: 0; }
  .cell .nm { display: flex; align-items: center; gap: var(--s-8); }
  .cell .dot8 { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .cell .val { text-align: right; }
  .cell .val input { width: 72px; text-align: right; border: 1px solid transparent; border-radius: var(--r-8); padding: 2px 6px; background: transparent; font-weight: 600; }
  .cell .val input:focus { border-color: var(--brand-base); background: var(--bg-base); outline: none; }
  .row-tog { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: var(--s-12); min-height: 56px; padding: var(--s-8) var(--s-16); text-align: left; }
  .row-tog:active { background: var(--wrapper-a4); }
  /* кнопка раскрытия внутри карточки: снизу и по бокам 16, сверху от контента 20 (у карточки списка свой нижний отступ, его гасим) */
  .cells:has(.ck-more) { padding-bottom: 0 !important; }
  .ck-more { padding: var(--s-20) var(--s-16) var(--s-16); }

  /* этапы разбора: itemCheck */
  .ich { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 12px 14px; border-radius: var(--r-12); background: var(--wrapper-a4); font-size: 14px; line-height: 20px; color: var(--text-a56); }
  .ich + .ich { margin-top: var(--s-8); }
  .ich .ck { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--stroke-a12); display: grid; place-items: center; color: #fff; flex: none; }
  .ich.done { color: var(--text-a100); } .ich.done .ck { background: var(--success); border-color: var(--success); }

  /* опросник на сводке */
  .qcard { background: var(--brand-base); color: var(--text-white); border-radius: var(--r-20); padding: var(--s-16); }
  .qcard .caps, .qcard .muted { color: var(--text-white) !important; }
  .qcard .opt { background: var(--surface-base); color: var(--text-a100); }
  .qcard .opts.wrap .opt { flex: 1 1 auto; min-height: 48px; border-radius: var(--r-12); font-size: 15px; }
  .qcard .top { display: flex; justify-content: space-between; margin-bottom: var(--s-8); }
  .qcard .bars { display: flex; gap: 4px; margin-bottom: var(--s-12); }
  .qcard .bars i { flex: 1; height: 4px; border-radius: 2px; background: #FFFFFF59; }
  .qcard .bars i.on { background: var(--text-white); }
  .qcard .why { display: flex; justify-content: space-between; gap: var(--s-12); margin-top: var(--s-12); }
  /* высота не прыгает между вопросами: текст вопроса занимает 4 строки */
  .qcard { display: flex; flex-direction: column; min-height: 228px; }
  .qcard > .t-2xl { flex: 1; }
  .qcard > .opts { margin-top: var(--s-12); }
  .qdone { display: flex; align-items: center; gap: var(--s-12); }

  /* скелетоны: единственная анимация */
  .skel { border-radius: var(--r-20); padding: var(--s-16); box-shadow: inset 0 0 0 1px var(--stroke-a12); display: grid; grid-template-columns: 40px 1fr; gap: var(--s-12); }
  .sk { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--wrapper-a6) 0%, var(--wrapper-a12) 50%, var(--wrapper-a6) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
  .sk.circle { width: 40px; height: 40px; border-radius: 50%; }
  .sk + .sk { margin-top: 8px; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; background: var(--wrapper-a6); } }

  /* главное на экране отклонения */
  .hero { text-align: center; padding: var(--s-16) var(--s-8) var(--s-8); }
  /* дуговая шкала в шапке экрана темы, как в «Здоровье» */
  .arc { position: relative; width: 100%; max-width: 300px; margin: var(--s-8) auto 0; }
  .arc svg { display: block; width: 100%; height: auto; overflow: visible; }
  .arc .in { position: absolute; left: 0; right: 0; bottom: 4%; text-align: center; }
  .arc .in .v { font-size: 48px; line-height: 52px; font-weight: 700; }
  .arc .in .u { font-size: 14px; line-height: 20px; color: var(--text-a56); }
  .arc .lim { font: 500 12px/16px var(--font); fill: var(--text-a56); }
  .duo .arc .in .v { font-size: 30px; line-height: 34px; }
  /* табы показателей темы под дугой: есть результат — цвет статуса, нет — серый */
  .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: var(--s-16) calc(-1 * var(--s-16)) 0; padding: 2px var(--s-16); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; color: #fff; }
  .tab.t-off { background: var(--negative); } .tab.t-edge { background: var(--mono-700); } .tab.t-ok { background: var(--success); }
  .tab.t-miss { background: var(--wrapper-a6); color: var(--text-a56); }
  .tab[aria-selected="true"] { box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 4px var(--text-a100); }
  .arc.miss .in .v { color: var(--text-a32); }
  .duo .arc .in .u { font-size: 12px; line-height: 16px; }
  .hero .v { font-size: 48px; line-height: 56px; font-weight: 700; }
  .hero .pill { display: inline-block; margin-top: var(--s-12); font-size: 14px; line-height: 20px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
  .pill.st-off { background: var(--negative-bg); } .pill.st-edge { background: var(--mono-100); } .pill.st-exp { background: var(--success-bg); }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-12); }
  .duo .hero .v { font-size: 36px; line-height: 44px; }
  .causes { padding: 0; margin: 0; counter-reset: c; display: flex; flex-direction: column; gap: var(--s-12); }
  .causes li { list-style: none; counter-increment: c; display: grid; grid-template-columns: 24px 1fr; gap: var(--s-8); }
  .causes li::before { content: counter(c); width: 24px; height: 24px; border-radius: 50%; background: var(--wrapper-a6); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .causes li.new::before { background: var(--brand-base); color: #fff; }

/* ============================ РЕНДЕР И НАВИГАЦИЯ ============================ */
function render() {
  const views = { start: vStart, orders: vOrders, upload: vUpload, check: vCheck, gen: vGen, summary: vSummary, detail: () => vDetail(state.sys) };
  document.body.classList.toggle('gen-mode', state.screen === 'gen');
  // первый экран и чтение бланка помещаются целиком — без вертикального скролла
  document.body.classList.toggle('fit', state.screen === 'start' || state.screen === 'upload');
  // лента карточек анализов не должна прыгать в начало после выбора
  const segX = {}; document.querySelectorAll('[data-seg]').forEach(e => { segX[e.dataset.seg] = e.scrollLeft; });
  document.getElementById('app').innerHTML = (views[state.screen] || vStart)();
  document.querySelectorAll('[data-seg]').forEach(e => { if (segX[e.dataset.seg]) e.scrollLeft = segX[e.dataset.seg]; });
  // выбранный таб всегда виден: если ряд ещё не прокручивали, подвинуть к выбранному
  document.querySelectorAll('.tabs').forEach(t => { const a = t.querySelector('[aria-selected="true"]'); if (a && !segX[t.dataset.seg] && a.offsetLeft + a.offsetWidth > t.clientWidth) t.scrollLeft = a.offsetLeft - 16; });
  document.getElementById('bar').innerHTML = bottomBar();
  const sheets = { upload: sheetUpload, files: sheetFiles, login: sheetLogin, cart: sheetCart, theme: sheetTheme };
  // при перерисовке открытая шторка не должна прыгать в начало
  const keepY = state.sheet && state.sheet === lastSheet ? document.querySelector('#sheet .sheet')?.scrollTop : 0;
  // корзина видна и поверх шторки темы
  document.body.classList.toggle('th-open', state.sheet === 'theme'); document.body.classList.toggle('has-cart', state.picked.size > 0);
  document.getElementById('sheet').innerHTML = sheets[state.sheet] ? sheets[state.sheet]() : '';
  if (keepY) document.querySelector('#sheet .sheet').scrollTop = keepY;
  if (state.sheet && state.sheet !== lastSheet) {
    document.querySelector('#sheet .sheet, #sheet .fp')?.classList.add('in');
    if (!lastSheet) document.querySelector('#sheet .veil')?.classList.add('in');
  }
  const veilEl = document.querySelector('#sheet .veil'); if (veilEl) veilEl.style.top = scrollY + 'px';
  lastSheet = state.sheet;
  document.body.classList.toggle('noscroll', !!state.sheet);
  if (state.screen === 'upload' && !state.uploadTimer) startUpload();
  if (state.screen === 'gen' && !state.genStart) startGen();
}
let lastSheet = null;
// Закрыть шторку: уезжает вниз, фон гаснет
function closeSheet() {
  const el = document.querySelector('#sheet .sheet, #sheet .fp'), veil = document.querySelector('#sheet .veil');
  const done = () => { state.sheet = null; render(); };
  if (!el) return done();
  el.style.transition = 'transform .26s cubic-bezier(.4, 0, 1, 1)'; el.style.transform = 'translate(-50%, 100%)';
  if (veil) { veil.style.transition = 'opacity .26s'; veil.style.opacity = '0'; }
  setTimeout(done, 260);
}
// Свайп вниз: тянем за ручку или за шторку, когда она прокручена к началу
(function () {
  let el = null, veil = null, y0 = 0, dy = 0, t0 = 0, moved = false;
  const start = (e, y) => {
    const s = e.target.closest('#sheet .sheet, #sheet .fp'); if (!s) return;
    if (!e.target.closest('.handle') && s.scrollTop > 0) return;
    el = s; veil = document.querySelector('#sheet .veil'); y0 = y; dy = 0; t0 = Date.now(); moved = false;
  };
  const move = (e, y) => {
    if (!el) return; dy = Math.max(0, y - y0);
    if (dy > 4) moved = true; if (!moved) return;
    if (e.cancelable) e.preventDefault();
    el.style.transition = 'none'; el.style.transform = `translate(-50%, ${dy}px)`;
    if (veil) { veil.style.transition = 'none'; veil.style.opacity = String(Math.max(0, 1 - dy / el.offsetHeight)); }
  };
  const end = () => {
    if (!el) return; const s = el; el = null;
    if (!moved) return;
    const v = dy / Math.max(1, Date.now() - t0);
    if (dy > s.offsetHeight * 0.3 || v > 0.6) return closeSheet();
    s.style.transition = 'transform .3s cubic-bezier(.32, .72, 0, 1)'; s.style.transform = '';
    if (veil) { veil.style.transition = 'opacity .3s'; veil.style.opacity = ''; }
    // не считать отпускание кликом по кнопке
    const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => document.removeEventListener('click', stop, { capture: true }), 50);
  };
  document.addEventListener('touchstart', e => start(e, e.touches[0].clientY), { passive: true });
  document.addEventListener('touchmove', e => move(e, e.touches[0].clientY), { passive: false });
  document.addEventListener('touchend', end); document.addEventListener('touchcancel', end);
  document.addEventListener('mousedown', e => start(e, e.clientY));
  document.addEventListener('mousemove', e => { if (el) move(e, e.clientY); });
  document.addEventListener('mouseup', end);
})();
function go(screen, restore = false) { if (screen === 'gen') state.genStart = 0; state.screen = screen; state.sheet = null; render(); window.scrollTo(0, restore ? state.summaryY : 0); }
let uploadRun = 0;
function startUpload() {
  state.uploadTimer = true; state.uploadStart = performance.now(); const run = ++uploadRun;
  const tick = () => {
    if (state.screen !== 'upload' || run !== uploadRun) return;
    state.stagesDone++; render();
    if (state.stagesDone < 3) setTimeout(tick, 1300);
    else setTimeout(() => { if (state.screen === 'upload' && run === uploadRun) go('check'); }, 1000);
  };
  setTimeout(tick, 1300);
}
function startScenario(n, entry) {
  const sc = SCENARIOS[n]; if (!sc.ind0) sc.ind0 = sc.ind.map(o => ({ ...o })); sc.ind = sc.ind0.map(o => calcStatus({ ...o }));
  Object.assign(state, { scenario: n, entry: entry || null, lab: entry === 'B' ? 'сдача в Lab4U' : null, date: entry === 'B' ? { 1: '21 августа', 2: '2 июля' }[n] : null,
    sys: null, sheet: null, answers: {}, sym: {}, picked: new Set(), skipped: new Set(), genOpen: false, normOpen: false, checkNormOpen: false, stagesDone: 0, uploadTimer: false, stub: {}, summaryY: 0, tab: {} });
  go(ent() === 'A' ? 'upload' : 'check');
}
function home() { Object.assign(state, { scenario: null, entry: null, sheet: null, stub: {}, reg: false }); go('start'); }

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-close]'); if (!t) return;
  const d = t.dataset;
  if ('upload' in d) { state.sheet = 'upload'; return render(); }
  if ('files' in d) { state.sheet = 'files'; return render(); }
  if (d.file) { if (d.file === 'w') { state.stub.fw = !state.stub.fw; return render(); } return startScenario(Number(d.file), 'A'); }
  if ('mine' in d) { state.after = 'orders'; state.reg = false; state.sheet = 'login'; return render(); }
  if ('reg' in d) { state.reg = !state.reg; return render(); }
  if ('login' in d) { state.loggedIn = true; state.sheet = null; state.reg = false; return go(state.after || 'summary'); }
  if ('back' in d) {
    if (state.screen === 'detail') return go('summary', true);
    if (state.screen === 'check' && ent() === 'B') return go('orders');
    if (state.screen === 'orders' || state.screen === 'summary' || state.screen === 'upload' || state.screen === 'check') return home();
    return home();
  }
  if (d.order) {
    const o = SCENARIOS[2].orders.find(x => x.id === d.order);
    if (o.go) return startScenario(o.go, 'B');
    state.stub['order' + o.id] = !state.stub['order' + o.id]; return render();
  }
  if (d.tab) { const [sid, code] = d.tab.split('|'); state.tab = { ...(state.tab || {}), [sid]: code }; return render(); }
  if (d.sys) { state.sys = d.sys; state.tab = {}; state.sheet = 'theme'; return render(); }
  if (d.q) { state.answers[d.q] = d.a; return render(); }
  if ('normck' in d) { state.checkNormOpen = !state.checkNormOpen; return render(); }
  if ('ckreset' in d) { CHECK_QS.forEach(q => { delete state.answers[q.id]; }); return render(); }
  if (d.sym) { state.sym[d.sym] = d.a; return render(); }
  if (d.skip) { state.skipped.add(d.skip); return render(); }
  if ('reset' in d) {
    const ids = d.reset ? Object.keys(QUESTIONS).filter(q => QUESTIONS[q].sys === d.reset) : Object.keys(QUESTIONS);
    ids.forEach(q => { delete state.sym[q]; state.skipped.delete(q); }); state.genOpen = false; return render();
  }
  if (d.pick) { d.pick.split(',').forEach(c => state.picked.add(c)); return render(); }
  if (d.unpick) { d.unpick.split(',').forEach(c => state.picked.delete(c)); return render(); }
  if (d.toggle) { state.picked.has(d.toggle) ? state.picked.delete(d.toggle) : state.picked.add(d.toggle); return render(); }
  if ('gen' in d) { state.genOpen = true; return render(); }
  if ('norm' in d) { state.normOpen = !state.normOpen; return render(); }
  if (d.stub) { state.stub[d.stub] = !state.stub[d.stub]; return render(); }
  if (d.pickall) { d.pickall.split(',').forEach(c => state.picked.add(c)); return render(); }
  if (d.sheet) { state.sheet = d.sheet; return render(); }
  if ('close' in d) return closeSheet();
  if ('confirm' in d) { if (ent() === 'A' && !state.loggedIn) { state.after = 'gen'; state.reg = true; state.sheet = 'login'; return render(); } return go('gen'); }
  if ('register' in d) { return go('summary'); }
  if (d.anchor) { go('summary'); const el = document.getElementById(d.anchor); if (el) el.scrollIntoView({ block: 'start' }); window.scrollBy(0, -64); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.item) { t.checked ? state.picked.add(t.dataset.item) : state.picked.delete(t.dataset.item); return render(); }
  if (t.dataset.val) {
    const v = parseFloat(t.value.replace(',', '.')); const i = indOf(S(), t.dataset.val);
    if (!isNaN(v) && isFinite(v) && v >= 0) { i.value = v; calcStatus(i); }
    render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) { state.sheet = null; render(); } });
window.addEventListener('DOMContentLoaded', render);
if (location.search.includes('debug')) {
  const dbg = document.createElement('div'); dbg.style.cssText = 'position:fixed;left:8px;top:60px;z-index:99;background:#000c;color:#0f0;font:11px monospace;padding:4px 6px;border-radius:6px;max-width:90vw;pointer-events:none';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(dbg));
  const errs = []; window.addEventListener('error', e => errs.push(e.message + ' @' + e.lineno));
  setInterval(() => { const v = document.querySelector('#sheet .veil'); dbg.textContent = `veil=${v ? v.style.opacity + '/' + getComputedStyle(v).opacity : '-'} body=${document.body.style.backgroundColor} ${errs.join(' | ')}`; }, 200);
}
</script>
